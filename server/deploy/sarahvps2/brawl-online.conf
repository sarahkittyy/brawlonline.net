# Brawl Online on sarahvps2: brawlonline.net serves the static website from
# /var/www/brawlonline and proxies the accounts API and the email-link pages to
# pp-accounts on 127.0.0.1:43180. www.brawlonline.net redirects to the apex.
# (mm.brawlonline.net is UDP 43113 straight to pp-mm; nginx is not involved.)
#
# /etc/nginx/sites-available/brawl-online.conf. NOT enabled until DNS exists. Then:
#   sudo ln -s /etc/nginx/sites-available/brawl-online.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d brawlonline.net -d www.brawlonline.net --redirect
# certbot adds the `listen 443 ssl` lines and the HTTP->HTTPS redirects to both
# server blocks, as on the other sites.

# Link previews (Discordbot and the like) don't run scripts, so the static /r/<code> page can't
# name its ruleset for them: the `^/r/<code>` location sends them to accounts' preview page,
# whose title is "<name> v<version> by <publisher>" with no description (rulesets.rs `preview`).
map $http_user_agent $brawl_unfurler {
	default 0;
	"~*(discordbot|twitterbot|slackbot|facebookexternalhit|telegrambot|whatsapp|linkedinbot|redditbot|mastodon|bluesky|skypeuripreview|embedly|iframely)" 1;
}

server {
	server_name www.brawlonline.net;

	return 301 https://brawlonline.net$request_uri;

	listen 80;
}

server {
	server_name brawlonline.net;

	root /var/www/brawlonline;
	index index.html;

	access_log /var/log/nginx/brawl-online.access.log;
	error_log /var/log/nginx/brawl-online.error.log;

	# The API takes small JSON bodies only (a bug report's logs zip has its own location below).
	client_max_body_size 64k;

	add_header X-Content-Type-Options nosniff always;
	add_header Referrer-Policy no-referrer always;
	add_header X-Frame-Options DENY always;

	# The ruleset page link previews get (the ^/r/<code> location below rewrites their requests
	# here). If accounts doesn't answer it (404, e.g. an accounts from before the endpoint),
	# they get the static page as before.
	location ~ "^/v1/rulesets/[A-Za-z0-9]{1,16}/preview$" {
		proxy_pass http://127.0.0.1:43180;
		proxy_http_version 1.1;
		proxy_set_header Connection        "";
		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 30s;
		proxy_intercept_errors on;
		error_page 404 = /r/index.html;
	}

	# A bug report's logs zip (the launcher's bug button), the one large upload: up to accounts'
	# BUG_REPORT_MAX_LOGS_BYTES (32 MiB) with room to spare, streamed to accounts as it comes
	# (accounts checks the size and answers 413 itself), and time for a slow uplink.
	location ~ "^/v1/bug-reports/[0-9]{1,18}/logs$" {
		client_max_body_size 40m;
		proxy_request_buffering off;
		proxy_pass http://127.0.0.1:43180;
		proxy_http_version 1.1;
		proxy_set_header Connection        "";
		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 300s;
		proxy_send_timeout 300s;
	}

	# Everything pp-accounts serves: the JSON API (/v1/), Slippi's users-rest
	# endpoint (/user/<uid>), the pages the emails link to (/verify-email,
	# /reset-password) and the health check.
	location ~ ^/(v1/|user/|verify-email$|reset-password$|healthz$) {
		proxy_pass http://127.0.0.1:43180;
		proxy_http_version 1.1;
		proxy_set_header Connection        "";
		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		# accounts (TRUST_PROXY_HEADERS=true) uses the LAST entry, which nginx
		# appends here, so a client cannot spoof it. Keep the DNS record grey-cloud:
		# behind Cloudflare's proxy the last entry would be a Cloudflare address
		# (see PROD.md before turning the proxy on).
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 30s;
	}

	# The static website.
	# Ruleset pages: /r/<code> is website/r/index.html, which reads the code from the address
	# (docs/rulesets-protocol.md §4); its own files (/r/ruleset.js, .css) are served as they are.
	location /r/ {
		try_files $uri /r/index.html;
	}
	location ~ "^/r/(?<ruleset_code>[A-Za-z0-9]{1,16})$" {
		if ($brawl_unfurler) {
			rewrite ^ /v1/rulesets/$ruleset_code/preview last;
		}
		try_files $uri /r/index.html;
	}

	location / {
		try_files $uri $uri/ =404;
	}

	listen 80;
}
