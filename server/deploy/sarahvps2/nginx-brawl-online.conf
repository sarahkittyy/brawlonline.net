# Brawl Online on sarahvps2: brawlonline.net serves the static website from
# /var/www/brawlonline and proxies the accounts API and the email-link pages to
# pp-accounts on 127.0.0.1:43180. www.brawlonline.net redirects to the apex.
# (mm.brawlonline.net is UDP 43113 straight to pp-mm; nginx is not involved.)
#
# /etc/nginx/sites-available/brawl-online.conf. NOT enabled until DNS exists. Then:
#   sudo ln -s /etc/nginx/sites-available/brawl-online.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d brawlonline.net -d www.brawlonline.net --redirect
# certbot adds the `listen 443 ssl` lines and the HTTP->HTTPS redirects to both
# server blocks, as on the other sites.

# Link previews (Discordbot and the like) don't run scripts, so the static /r/<code> page can't
# name its ruleset for them: the `^/r/<code>` location sends them to accounts' preview page,
# whose title is "<name> v<version> by <publisher>" with no description (rulesets.rs `preview`).
map $http_user_agent $brawl_unfurler {
	default 0;
	"~*(discordbot|twitterbot|slackbot|facebookexternalhit|telegrambot|whatsapp|linkedinbot|redditbot|mastodon|bluesky|skypeuripreview|embedly|iframely)" 1;
}

# Build assets whose license forbids publishing the files (Layerlab's rank emblems,
# docs/design/ranked-tiers.md §5.1): the snippet, not in git, maps the build token to 1:
#   map $http_authorization $brawl_build_assets_ok { default 0; "Bearer <token>" 1; }
# CI has the token as the RANK_BADGES_TOKEN secret (tools/rank-badges/fetch_badges.sh).
include /etc/nginx/snippets/brawl-online-build-assets-token.conf;

server {
	server_name www.brawlonline.net;

	return 301 https://brawlonline.net$request_uri;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/brawlonline.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/brawlonline.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
	server_name brawlonline.net;

	root /var/www/brawlonline;
	index index.html;

	access_log /var/log/nginx/brawl-online.access.log;
	error_log /var/log/nginx/brawl-online.error.log;

	# The API takes small JSON bodies only (a bug report's logs zip and an SD card listing have
	# their own locations below).
	include /etc/nginx/snippets/brawl-online-cloudflare-realip.conf;

	client_max_body_size 64k;

	add_header X-Content-Type-Options nosniff always;
	add_header Referrer-Policy no-referrer always;
	add_header X-Frame-Options DENY always;

	# The ruleset page link previews get (the ^/r/<code> location below rewrites their requests
	# here). If accounts doesn't answer it (404, e.g. an accounts from before the endpoint),
	# they get the static page as before.
	location ~ "^/v1/rulesets/[A-Za-z0-9]{1,16}/preview$" {
		proxy_pass http://127.0.0.1:43180;
		proxy_http_version 1.1;
		proxy_set_header Connection        "";
		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 30s;
		proxy_intercept_errors on;
		error_page 404 = /r/index.html;
	}

	# A bug report's logs zip (the launcher's bug button), the one large upload: up to accounts'
	# BUG_REPORT_MAX_LOGS_BYTES (32 MiB) with room to spare, streamed to accounts as it comes
	# (accounts checks the size and answers 413 itself), and time for a slow uplink.
	location ~ "^/v1/bug-reports/[0-9]{1,18}/logs$" {
		client_max_body_size 40m;
		proxy_request_buffering off;
		proxy_pass http://127.0.0.1:43180;
		proxy_http_version 1.1;
		proxy_set_header Connection        "";
		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 300s;
		proxy_send_timeout 300s;
	}

	# An Other Games room's SD card listing (the host's launcher puts it, joiners' launchers fetch
	# it): a few MB (2.9 MB for an 8 GB card), up to accounts' SD_LISTING_MAX_BYTES (64 MiB) with
	# room to spare, streamed to accounts, which checks the size itself. Under the 64k above every
	# upload got nginx's 413 (bug #86).
	location ~ "^/v1/sd-cards/[0-9a-f]{64}/listing$" {
		client_max_body_size 72m;
		proxy_request_buffering off;
		proxy_pass http://127.0.0.1:43180;
		proxy_http_version 1.1;
		proxy_set_header Connection        "";
		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 300s;
		proxy_send_timeout 300s;
	}

	# Everything pp-accounts serves: the JSON API (/v1/), Slippi's users-rest
	# endpoint (/user/<uid>), the pages the emails link to (/verify-email,
	# /reset-password) and the health check.
	location ~ ^/(v1/|user/|verify-email$|reset-password$|healthz$) {
		proxy_pass http://127.0.0.1:43180;
		proxy_http_version 1.1;
		proxy_set_header Connection        "";
		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		# accounts (TRUST_PROXY_HEADERS=true) uses the LAST entry, which nginx
		# appends here. The record is orange-cloud, so the realip snippet above first
		# restores the client address from CF-Connecting-IP (only for Cloudflare edges),
		# so the last entry is still the real client.
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 30s;
	}

	# The Discord invite (the website footer, the launcher header). 302, not 301: browsers
	# keep a 301 forever, so a new invite would not reach them. Link previews still show
	# the server's card, as unfurlers (Discordbot among them) follow the redirect to
	# discord.com/invite/..., which serves its og: tags to them as to browsers.
	location ~ ^/discord/?$ {
		return 302 https://discord.gg/BsR9xq5bgM;
	}

	# The rank badges' tarball for builds, only with the token; a 404 without it. Never cached
	# (Cloudflare included), so a response without the token can't serve one with it.
	location = /build-assets/rank-badges {
		add_header Cache-Control "no-store" always;
		if ($brawl_build_assets_ok = 0) {
			return 404;
		}
		default_type application/gzip;
		alias /var/lib/brawl-build-assets/rank-badges.tar.gz;
	}

	# The static website.
	# Stable installer names change content every release: let browsers and Cloudflare
	# revalidate instead of serving a cached previous version for hours.
	location /downloads/ {
		add_header Cache-Control "no-cache" always;
		add_header X-Content-Type-Options nosniff always;
		try_files $uri =404;
	}

	# Ruleset pages: /r/<code> is website/r/index.html, which reads the code from the address
	# (docs/rulesets-protocol.md §4); its own files (/r/ruleset.js, .css) are served as they are.
	location /r/ {
		try_files $uri /r/index.html;
	}
	location ~ "^/r/(?<ruleset_code>[A-Za-z0-9]{1,16})$" {
		if ($brawl_unfurler) {
			rewrite ^ /v1/rulesets/$ruleset_code/preview last;
		}
		try_files $uri /r/index.html;
	}

	location / {
		try_files $uri $uri/ =404;
	}

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/brawlonline.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/brawlonline.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = brawlonline.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


	server_name brawlonline.net;

	listen 80;
    return 404; # managed by Certbot


}

server {
    if ($host = www.brawlonline.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


	server_name www.brawlonline.net;

	listen 80;
    return 404; # managed by Certbot


}
