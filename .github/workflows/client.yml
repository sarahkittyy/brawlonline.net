# Client: the game plugin, our Dolphin (Linux and Windows) and the launcher packages (AppImage,
# NSIS installer), published to https://brawlonline.net/downloads/ and to the launcher's
# electron-updater feed https://brawlonline.net/updates/launcher/ (generic provider). Installed
# launchers update themselves from that feed; the bundled Dolphin and plugin update with them.
#
# Version: 0.1.<run number of this workflow>, stamped into the launcher, Dolphin's version string
# and its matchmaking appVersion (.github/scripts/stamp-version.sh).
#
# Runners:
#   - Linux builds (plugin, Dolphin, launcher tests, AppImage): Namespace runner profile
#     namespace-profile-brawlonline (Ubuntu 24.04, x64) in the plugin and linux jobs; the optional
#     repository variable CLIENT_LINUX_RUNNER (a JSON list of labels) overrides it. On Namespace
#     the jobs install the build packages and keep $CI_CACHE (build tree, ccache, plugin toolchain)
#     on the profile's cache volume; on GitHub-hosted ubuntu-24.04 they install the packages and
#     keep ccache and the toolchain in the Actions cache; on our own self-hosted machines they use
#     the runner's own packages and $CI_CACHE. sarahvps2 (production) only publishes.
#   - Windows: GitHub-hosted (paid per minute on a private repository: paths below, caches).
#   - Publishing: always sarahvps2 (pp-release client). Builds from other machines arrive as
#     Actions artifacts (1-day retention, deleted after publishing).
#   - macOS: Namespace runner profile namespace-profile-brawlonline-mac (Apple silicon), $CI_CACHE
#     (Qt, build tree, ccache) on its cache volume. Developer ID signed and notarized (repository
#     secrets, see the macos job). It publishes on its own (publish-mac): Apple's notary service
#     can take minutes or hours, so Linux and Windows never wait for it, and a failed or skipped
#     macOS build never holds them back.
#
# Concurrency is per job (group client-<job>, never cancelled while running): a newer push's
# Linux and Windows builds start as soon as the previous ones finish, even while that run's macOS
# job still waits for Apple; each job still finishes and saves its caches, and each platform's
# feed is published in push order. A job waiting for its turn is replaced by a newer push's.
#
# Runs only on pushes to main and by hand, never on pull requests (self-hosted runners).
name: client

on:
  push:
    branches: [main]
    paths:
      - "dolphin/**"
      - "launcher/**"
      - "game-code/**"
      - "tools/gamecode/**"
      - "NOTICE"
      - ".github/workflows/client.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  VERSION: 0.1.${{ github.run_number }}
  NODE_VERSION: "24"

jobs:
  plugin:
    # The game plugin (PPOnline.rel) is platform independent: built once, on Linux.
    concurrency:
      group: client-plugin
      cancel-in-progress: false
    # Linux client runner (same default as the linux job):
    runs-on: ${{ fromJSON(vars.CLIENT_LINUX_RUNNER || '["namespace-profile-brawlonline"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          path: client
          persist-credentials: false
      - name: Cache volume (Namespace runner)
        if: startsWith(runner.name, 'nsc-runner-')
        run: echo "CI_CACHE=$NSC_CACHE_PATH/ci-cache" >> "$GITHUB_ENV"
      - uses: actions/cache@v5
        if: runner.environment == 'github-hosted'
        with:
          path: ~/ci-cache/toolchains
          key: gamecode-toolchain-${{ hashFiles('client/tools/gamecode/setup_toolchain.py') }}
      - name: Build
        working-directory: client
        run: |
          git submodule update --init --recursive --depth 1 -- game-code
          cache="${CI_CACHE:-$HOME/ci-cache}"; mkdir -p "$cache/toolchains"
          # setup_toolchain.py installs into <repo>/toolchains; keep the toolchain between runs.
          ln -sfn "$cache/toolchains" toolchains
          python3 tools/gamecode/setup_toolchain.py
          nice -n 19 sh game-code/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: client/game-code/PPOnline/PPOnline.rel
          retention-days: 1
          if-no-files-found: error

  linux:
    needs: plugin
    concurrency:
      group: client-linux
      cancel-in-progress: false
    # Linux client runner (same default as the plugin job):
    runs-on: ${{ fromJSON(vars.CLIENT_LINUX_RUNNER || '["namespace-profile-brawlonline"]') }}
    timeout-minutes: 240
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      USE_HARD_LINKS: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          path: client
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build packages (Namespace or GitHub-hosted runner)
        if: startsWith(runner.name, 'nsc-runner-') || runner.environment == 'github-hosted'
        run: |
          # Dolphin's Linux build dependencies (dolphin/Tools/docker/linux-build.Dockerfile) and
          # qmake6 for linuxdeploy's Qt plugin. Our own self-hosted runners have them in their image.
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends             cmake ninja-build ccache pkg-config gettext qt6-base-dev qt6-base-private-dev qt6-svg-dev             qmake6 qt6-qpa-plugins libavcodec-dev libavformat-dev libavutil-dev libswscale-dev             libxi-dev libxrandr-dev libudev-dev libevdev-dev libsfml-dev libminiupnpc-dev             libmbedtls-dev libcurl4-openssl-dev libhidapi-dev libsystemd-dev libbluetooth-dev             libasound2-dev libpulse-dev libpugixml-dev libbz2-dev libzstd-dev liblzo2-dev libpng-dev             libusb-1.0-0-dev libgl-dev libegl-dev file patchelf
          echo "JOBS=$(nproc)" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
      - name: Cache volume (Namespace runner)
        if: startsWith(runner.name, 'nsc-runner-')
        run: |
          # The profile's cache volume (50 GB) keeps the build tree and ccache between runs.
          echo "CI_CACHE=$NSC_CACHE_PATH/ci-cache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=5G" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v5
        if: runner.environment == 'github-hosted'
        with:
          path: ~/ci-cache/ccache
          key: linux-ccache-${{ github.run_id }}
          restore-keys: linux-ccache-
      - name: Stamp version ${{ env.VERSION }}
        run: client/.github/scripts/stamp-version.sh "$VERSION"
      - name: Dolphin
        run: client/.github/scripts/build-dolphin-linux.sh "$VERSION" "$GITHUB_WORKSPACE/client/launcher/release/dolphin"
      # Saved right after the build, also when a later step fails.
      - uses: actions/cache/save@v5
        if: ${{ runner.environment == 'github-hosted' && !cancelled() }}
        with:
          path: ~/ci-cache/ccache
          key: linux-ccache-${{ github.run_id }}
      - uses: actions/download-artifact@v7
        with:
          name: plugin
          path: ${{ runner.temp }}/plugin
      - name: Launcher dependencies
        working-directory: client/launcher
        run: |
          nice -n 19 npm ci --no-audit --no-fund
          node node_modules/electron/install.js
      - name: Launcher build
        working-directory: client/launcher
        env:
          PPO_PLUGIN_PATH: ${{ runner.temp }}/plugin/PPOnline.rel
        run: |
          npm run stage:plugin
          nice -n 19 npm run build
      - name: Launcher checks and tests
        working-directory: client/launcher
        run: |
          npm run typecheck
          nice -n 19 npm test
      - name: Package (AppImage)
        working-directory: client/launcher
        run: |
          nice -n 19 npx electron-builder build --linux --publish never
          ls -l release/build
      - name: Check the package
        working-directory: client/launcher/release/build
        run: |
          ../../../.github/scripts/check-package.sh linux-unpacked
          mkdir -p "$RUNNER_TEMP/out-linux"
          mv latest-linux.yml *.AppImage "$RUNNER_TEMP/out-linux/"
          ls -l "$RUNNER_TEMP/out-linux"
      - uses: actions/upload-artifact@v7
        with:
          name: launcher-linux
          path: ${{ runner.temp }}/out-linux/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Clean up
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/out-linux" "$RUNNER_TEMP/plugin" client/launcher/release/build client/launcher/release/dolphin
          # Keep the caches bounded (ccache trims itself to CCACHE_MAXSIZE).
          du -sh "${CI_CACHE:-$HOME/ci-cache}"/* 2>/dev/null || true
          df -h / | tail -n 1

  windows:
    needs: plugin
    concurrency:
      group: client-windows
      cancel-in-progress: false
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 1500M
      NODE_OPTIONS: --max-old-space-size=8192
      USE_HARD_LINKS: "false"
      # Code signing is deferred. To sign later: add the repository secrets WIN_CSC_LINK (base64
      # .pfx or a URL) and WIN_CSC_KEY_PASSWORD ("win.signAndEditExecutable" is already true in
      # launcher/electron-builder.json). While the secrets are unset the build stays unsigned.
      CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - name: ccache
        shell: pwsh
        run: |
          $v = "4.14.1"
          $sha = "6219f3865ca59aec41ee4b678df171d5d35855ecb2b6dbbbd20690b3a68af7b4"
          $zip = "$env:RUNNER_TEMP\ccache.zip"
          Invoke-WebRequest "https://github.com/ccache/ccache/releases/download/v$v/ccache-$v-windows-x86_64.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $sha) { throw "ccache sha256 mismatch" }
          Expand-Archive $zip "$env:RUNNER_TEMP\ccache"
          (Get-ChildItem "$env:RUNNER_TEMP\ccache" -Directory)[0].FullName | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: win-ccache-${{ github.run_id }}
          restore-keys: win-ccache-
      - uses: actions/cache@v5
        with:
          path: ~/AppData/Local/electron/Cache
          key: win-electron-${{ hashFiles('launcher/package-lock.json') }}
          restore-keys: win-electron-
      - name: Stamp version ${{ env.VERSION }}
        shell: bash
        run: .github/scripts/stamp-version.sh "$VERSION"
      - name: Dolphin
        shell: pwsh
        run: .github/scripts/build-dolphin-windows.ps1 -Version $env:VERSION -Out launcher/release/dolphin
      # Saved right after the build, also when a later step fails (actions/cache saves on success only).
      - uses: actions/cache/save@v5
        if: ${{ !cancelled() }}
        with:
          path: .ccache
          key: win-ccache-${{ github.run_id }}
      - uses: actions/download-artifact@v7
        with:
          name: plugin
          path: ${{ runner.temp }}/plugin
      - name: Launcher dependencies
        working-directory: launcher
        run: |
          npm ci --no-audit --no-fund
          node node_modules/electron/install.js
      - name: Package (NSIS)
        working-directory: launcher
        shell: bash
        env:
          PPO_PLUGIN_PATH: ${{ runner.temp }}/plugin/PPOnline.rel
        run: |
          npm run stage:plugin
          npm run build
          npx electron-builder build --win --publish never
          ls -l release/build
      - name: Check the package
        working-directory: launcher/release/build
        shell: bash
        run: |
          ../../../.github/scripts/check-package.sh win-unpacked
          mkdir -p "$RUNNER_TEMP/out-win"
          mv latest.yml *.exe "$RUNNER_TEMP/out-win/"
          # No blockmap while nsis.differentialPackage is false (the updater downloads in full).
          mv *.exe.blockmap "$RUNNER_TEMP/out-win/" 2>/dev/null || true
          ls -l "$RUNNER_TEMP/out-win"
      - uses: actions/upload-artifact@v7
        with:
          name: launcher-windows
          path: ${{ runner.temp }}/out-win/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  macos:
    # Namespace Apple silicon runner (profile namespace-profile-brawlonline-mac): a native build
    # (Xcode's clang, Qt from aqtinstall, macdeployqt, codesign). Apple silicon only for now. Qt,
    # the build tree and ccache stay on the profile's cache volume. DISABLE_MACOS="true" turns it
    # off. A failed or skipped macOS build never holds back the Linux and Windows release.
    #
    # Signed with the Developer ID Application certificate and notarized with an App Store Connect
    # API key (repository secrets MACOS_SIGNING_P12 (base64 .p12 with the certificate, its key and
    # Apple's intermediate), MACOS_SIGNING_P12_PASSWORD, APPLE_API_KEY_P8 (the .p8's text),
    # APPLE_API_KEY_ID, APPLE_API_ISSUER). The job fails without them: the launcher updates itself
    # on macOS (MAC_SELF_UPDATE in launcher/src/common/product.ts), and an ad-hoc build in the
    # feed could not be installed over a signed one. npm ci runs before the signing keychain exists.
    if: ${{ vars.DISABLE_MACOS != 'true' }}
    needs: plugin
    concurrency:
      group: client-macos
      cancel-in-progress: false
    runs-on: namespace-profile-brawlonline-mac
    timeout-minutes: 150
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      USE_HARD_LINKS: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          path: client
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/launcher/package-lock.json
      - name: Build tools
        run: |
          brew install ninja ccache
          # The profile's cache volume (50 GB) keeps Qt, the build tree and ccache between runs.
          echo "CI_CACHE=$NSC_CACHE_PATH/ci-cache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=5G" >> "$GITHUB_ENV"
      - name: Stamp version ${{ env.VERSION }}
        run: client/.github/scripts/stamp-version.sh "$VERSION"
      - uses: actions/download-artifact@v7
        with:
          name: plugin
          path: ${{ runner.temp }}/plugin
      - name: Launcher dependencies
        working-directory: client/launcher
        run: |
          npm ci --no-audit --no-fund
          node node_modules/electron/install.js
      - name: Launcher build
        working-directory: client/launcher
        env:
          PPO_PLUGIN_PATH: ${{ runner.temp }}/plugin/PPOnline.rel
        run: |
          npm run stage:plugin
          npm run build
      - name: Signing keychain
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for v in P12 P12_PASSWORD API_KEY_P8 API_KEY_ID API_ISSUER; do
            [ -n "${!v}" ] || { echo "::error::a signing secret is missing ($v), see the macos job"; exit 1; }
          done
          # A throwaway keychain, unlocked for this job only, first in the search list (codesign
          # and Dolphin's mac-codesign.sh find the identity there).
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pass="$(openssl rand -hex 24)"
          echo "::add-mask::$kc_pass"
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          umask 077
          printf '%s' "$P12" | base64 --decode >"$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$kc" -f pkcs12 -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$kc"
          identity="$(security find-identity -v -p codesigning "$kc" | awk '/"Developer ID Application: / { print $2; exit }')"
          [ -n "$identity" ] || { echo "::error::MACOS_SIGNING_P12 has no valid Developer ID Application identity"; exit 1; }
          printf '%s\n' "$API_KEY_P8" >"$RUNNER_TEMP/notary-key.p8"
          {
            echo "MAC_SIGN_IDENTITY=$identity"
            echo "MAC_SIGN_KEYCHAIN=$kc"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notary-key.p8"
            echo "APPLE_API_KEY_ID=$API_KEY_ID"
            echo "APPLE_API_ISSUER=$API_ISSUER"
          } >>"$GITHUB_ENV"
      - name: Dolphin
        run: client/.github/scripts/build-dolphin-macos.sh "$VERSION" "$GITHUB_WORKSPACE/client/launcher/release/dolphin" arm64
      - name: Package (app, DMG, zip)
        run: client/.github/scripts/package-launcher-macos.sh "$RUNNER_TEMP/out-mac" arm64
      - name: Check the package
        working-directory: client/launcher/release/build
        run: ../../../.github/scripts/check-package.sh mac-arm64
      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/signing.p12"
      - uses: actions/upload-artifact@v7
        with:
          name: launcher-mac
          path: ${{ runner.temp }}/out-mac/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  publish:
    # Linux and Windows. The macOS build publishes on its own (publish-mac).
    needs: [linux, windows]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.windows.result == 'success' }}
    concurrency:
      group: client-publish
      cancel-in-progress: false
    runs-on: [self-hosted, linux, x64, sarahvps2, brawlonline]
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write # delete this run's artifacts after publishing
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: launcher-linux
          path: ${{ runner.temp }}/client
      - uses: actions/download-artifact@v7
        with:
          name: launcher-windows
          path: ${{ runner.temp }}/client
      - name: Publish
        run: |
          ls -l "$RUNNER_TEMP/client"
          sudo -n /usr/local/sbin/pp-release client "$RUNNER_TEMP/client"
      - name: Check
        env:
          FEEDS: latest.yml latest-linux.yml
          DOWNLOADS: BrawlOnline-Setup.exe BrawlOnline.AppImage
        run: |
          base=https://brawlonline.net
          for f in $FEEDS; do
            got=$(curl -fsS --max-time 20 "$base/updates/launcher/$f?nocache=$GITHUB_RUN_ID" | sed -n 's/^version: //p')
            echo "$f: $got"
            [ "$got" = "$VERSION" ] || { echo "$f does not name $VERSION" >&2; exit 1; }
          done
          for f in $DOWNLOADS; do
            curl -fsS --max-time 20 -o /dev/null -r 0-0 -w "$f: %{http_code}\n" "$base/downloads/$f?v=$VERSION"
          done
      - name: Delete the published artifacts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NAMES: launcher-linux launcher-windows
        run: |
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions"
          ids=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$api/runs/$GITHUB_RUN_ID/artifacts?per_page=100" |
            python3 -c 'import json,os,sys; names=os.environ["NAMES"].split(); print(" ".join(str(a["id"]) for a in json.load(sys.stdin)["artifacts"] if a["name"] in names))')
          for id in $ids; do
            curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$api/artifacts/$id" && echo "deleted artifact $id"
          done
          rm -rf "$RUNNER_TEMP/client"

  publish-mac:
    # The macOS build, whenever Apple's notary service is done with it (see publish).
    needs: macos
    if: ${{ !cancelled() && needs.macos.result == 'success' }}
    concurrency:
      group: client-publish-mac
      cancel-in-progress: false
    runs-on: [self-hosted, linux, x64, sarahvps2, brawlonline]
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write # delete this run's artifacts after publishing
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: launcher-mac
          path: ${{ runner.temp }}/client-mac
      - name: Publish
        run: |
          ls -l "$RUNNER_TEMP/client-mac"
          sudo -n /usr/local/sbin/pp-release client "$RUNNER_TEMP/client-mac"
      - name: Check
        env:
          FEEDS: latest-mac.yml
          DOWNLOADS: BrawlOnline.dmg
        run: |
          base=https://brawlonline.net
          for f in $FEEDS; do
            got=$(curl -fsS --max-time 20 "$base/updates/launcher/$f?nocache=$GITHUB_RUN_ID" | sed -n 's/^version: //p')
            echo "$f: $got"
            [ "$got" = "$VERSION" ] || { echo "$f does not name $VERSION" >&2; exit 1; }
          done
          for f in $DOWNLOADS; do
            curl -fsS --max-time 20 -o /dev/null -r 0-0 -w "$f: %{http_code}\n" "$base/downloads/$f?v=$VERSION"
          done
      - name: Delete the published artifacts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          # plugin too: the macos job is the last to use it (publish can't delete it, a macos job
          # waiting for its turn may not have downloaded it yet).
          NAMES: launcher-mac plugin
        run: |
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions"
          ids=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$api/runs/$GITHUB_RUN_ID/artifacts?per_page=100" |
            python3 -c 'import json,os,sys; names=os.environ["NAMES"].split(); print(" ".join(str(a["id"]) for a in json.load(sys.stdin)["artifacts"] if a["name"] in names))')
          for id in $ids; do
            curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$api/artifacts/$id" && echo "deleted artifact $id"
          done
          rm -rf "$RUNNER_TEMP/client-mac"
