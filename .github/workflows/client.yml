# Client: the game plugin, our Dolphin (Linux and Windows) and the launcher packages (AppImage,
# NSIS installer), published to https://brawlonline.net/downloads/ and to the launcher's
# electron-updater feed https://brawlonline.net/updates/launcher/ (generic provider). Installed
# launchers update themselves from that feed; the bundled Dolphin and plugin update with them.
#
# Version: 0.1.<run number of this workflow>, stamped into the launcher, Dolphin's version string
# and its matchmaking appVersion (.github/scripts/stamp-version.sh).
#
# Runners:
#   - Linux builds (plugin, Dolphin, launcher tests, AppImage): LINUX_RUNNER in the plugin and
#     linux jobs; the optional repository variable CLIENT_LINUX_RUNNER (a JSON list of labels)
#     overrides it. Default for now: GitHub-hosted ubuntu-24.04, because the Unraid runner
#     (["self-hosted","linux","x64","unraid","brawlonline"], docs/unraid-runner.md) corrupts
#     compiles under load (GCC internal compiler errors on varying files and CPUs, see docs/ci.md).
#     Switch back once its memory is stable. On a GitHub-hosted runner the jobs install the build
#     packages and keep ccache and the plugin toolchain in the Actions cache; on a self-hosted one
#     they use the runner's own packages and $CI_CACHE. sarahvps2 (production) only publishes.
#   - Windows: GitHub-hosted (minutes are limited on a private repository: paths below, caches).
#   - Publishing: always sarahvps2 (pp-release client). Builds from other machines arrive as
#     Actions artifacts (1-day retention, deleted after publishing).
#   - macOS: cross-compiled on the Unraid runner when ENABLE_MACOS is "true" (see the macos job).
#     A failed or skipped macOS build never holds back the Linux and Windows release.
#
# Runs only on pushes to main and by hand, never on pull requests (self-hosted runners).
name: client

on:
  push:
    branches: [main]
    paths:
      - "dolphin/**"
      - "launcher/**"
      - "game-code/**"
      - "tools/gamecode/**"
      - "NOTICE"
      - ".github/workflows/client.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client
  # Not cancelled: a newer push waits, so a running build finishes and saves its caches.
  cancel-in-progress: false

env:
  VERSION: 0.1.${{ github.run_number }}
  NODE_VERSION: "24"

jobs:
  plugin:
    # The game plugin (PPOnline.rel) is platform independent: built once, on Linux.
    # Linux client runner (same default as the linux job):
    runs-on: ${{ fromJSON(vars.CLIENT_LINUX_RUNNER || '["ubuntu-24.04"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          path: client
          persist-credentials: false
      - uses: actions/cache@v5
        if: runner.environment == 'github-hosted'
        with:
          path: ~/ci-cache/toolchains
          key: gamecode-toolchain-${{ hashFiles('client/tools/gamecode/setup_toolchain.py') }}
      - name: Build
        working-directory: client
        run: |
          git submodule update --init --recursive --depth 1 -- game-code
          cache="${CI_CACHE:-$HOME/ci-cache}"; mkdir -p "$cache/toolchains"
          # setup_toolchain.py installs into <repo>/toolchains; keep the toolchain between runs.
          ln -sfn "$cache/toolchains" toolchains
          python3 tools/gamecode/setup_toolchain.py
          nice -n 19 sh game-code/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: client/game-code/PPOnline/PPOnline.rel
          retention-days: 1
          if-no-files-found: error

  linux:
    needs: plugin
    # Linux client runner (same default as the plugin job):
    runs-on: ${{ fromJSON(vars.CLIENT_LINUX_RUNNER || '["ubuntu-24.04"]') }}
    timeout-minutes: 240
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      USE_HARD_LINKS: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          path: client
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build packages (GitHub-hosted runner)
        if: runner.environment == 'github-hosted'
        run: |
          # Dolphin's Linux build dependencies (dolphin/Tools/docker/linux-build.Dockerfile) and
          # qmake6 for linuxdeploy's Qt plugin. The self-hosted runners have them in their image.
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends             cmake ninja-build ccache pkg-config gettext qt6-base-dev qt6-base-private-dev qt6-svg-dev             qmake6 qt6-qpa-plugins libavcodec-dev libavformat-dev libavutil-dev libswscale-dev             libxi-dev libxrandr-dev libudev-dev libevdev-dev libsfml-dev libminiupnpc-dev             libmbedtls-dev libcurl4-openssl-dev libhidapi-dev libsystemd-dev libbluetooth-dev             libasound2-dev libpulse-dev libpugixml-dev libbz2-dev libzstd-dev liblzo2-dev libpng-dev             libusb-1.0-0-dev libgl-dev libegl-dev file patchelf
          echo "JOBS=$(nproc)" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v5
        if: runner.environment == 'github-hosted'
        with:
          path: ~/ci-cache/ccache
          key: linux-ccache-${{ github.run_id }}
          restore-keys: linux-ccache-
      - name: Stamp version ${{ env.VERSION }}
        run: client/.github/scripts/stamp-version.sh "$VERSION"
      - name: Dolphin
        run: client/.github/scripts/build-dolphin-linux.sh "$VERSION" "$GITHUB_WORKSPACE/client/launcher/release/dolphin"
      # Saved right after the build, also when a later step fails.
      - uses: actions/cache/save@v5
        if: ${{ runner.environment == 'github-hosted' && !cancelled() }}
        with:
          path: ~/ci-cache/ccache
          key: linux-ccache-${{ github.run_id }}
      - uses: actions/download-artifact@v7
        with:
          name: plugin
          path: ${{ runner.temp }}/plugin
      - name: Launcher dependencies
        working-directory: client/launcher
        run: |
          nice -n 19 npm ci --no-audit --no-fund
          node node_modules/electron/install.js
      - name: Launcher build
        working-directory: client/launcher
        env:
          PPO_PLUGIN_PATH: ${{ runner.temp }}/plugin/PPOnline.rel
        run: |
          npm run stage:plugin
          nice -n 19 npm run build
      - name: Launcher checks and tests
        working-directory: client/launcher
        run: |
          npm run typecheck
          nice -n 19 npm test
      - name: Package (AppImage)
        working-directory: client/launcher
        run: |
          nice -n 19 npx electron-builder build --linux --publish never
          ls -l release/build
      - name: Check the package
        working-directory: client/launcher/release/build
        run: |
          ../../../.github/scripts/check-package.sh linux-unpacked
          mkdir -p "$RUNNER_TEMP/out-linux"
          mv latest-linux.yml *.AppImage "$RUNNER_TEMP/out-linux/"
          ls -l "$RUNNER_TEMP/out-linux"
      - uses: actions/upload-artifact@v7
        with:
          name: launcher-linux
          path: ${{ runner.temp }}/out-linux/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Clean up
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/out-linux" "$RUNNER_TEMP/plugin" client/launcher/release/build client/launcher/release/dolphin
          # Keep the caches bounded (ccache trims itself to CCACHE_MAXSIZE).
          du -sh "${CI_CACHE:-$HOME/ci-cache}"/* 2>/dev/null || true
          df -h / | tail -n 1

  windows:
    needs: plugin
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 1500M
      NODE_OPTIONS: --max-old-space-size=8192
      USE_HARD_LINKS: "false"
      # Code signing is deferred. To sign later: add the repository secrets WIN_CSC_LINK (base64
      # .pfx or a URL) and WIN_CSC_KEY_PASSWORD, and set "win.signAndEditExecutable" to true in
      # launcher/electron-builder.json. While the secrets are unset the build stays unsigned.
      CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - name: ccache
        shell: pwsh
        run: |
          $v = "4.14.1"
          $sha = "6219f3865ca59aec41ee4b678df171d5d35855ecb2b6dbbbd20690b3a68af7b4"
          $zip = "$env:RUNNER_TEMP\ccache.zip"
          Invoke-WebRequest "https://github.com/ccache/ccache/releases/download/v$v/ccache-$v-windows-x86_64.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $sha) { throw "ccache sha256 mismatch" }
          Expand-Archive $zip "$env:RUNNER_TEMP\ccache"
          (Get-ChildItem "$env:RUNNER_TEMP\ccache" -Directory)[0].FullName | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: win-ccache-${{ github.run_id }}
          restore-keys: win-ccache-
      - uses: actions/cache@v5
        with:
          path: ~/AppData/Local/electron/Cache
          key: win-electron-${{ hashFiles('launcher/package-lock.json') }}
          restore-keys: win-electron-
      - name: Stamp version ${{ env.VERSION }}
        shell: bash
        run: .github/scripts/stamp-version.sh "$VERSION"
      - name: Dolphin
        shell: pwsh
        run: .github/scripts/build-dolphin-windows.ps1 -Version $env:VERSION -Out launcher/release/dolphin
      # Saved right after the build, also when a later step fails (actions/cache saves on success only).
      - uses: actions/cache/save@v5
        if: ${{ !cancelled() }}
        with:
          path: .ccache
          key: win-ccache-${{ github.run_id }}
      - uses: actions/download-artifact@v7
        with:
          name: plugin
          path: ${{ runner.temp }}/plugin
      - name: Launcher dependencies
        working-directory: launcher
        run: |
          npm ci --no-audit --no-fund
          node node_modules/electron/install.js
      - name: Package (NSIS)
        working-directory: launcher
        shell: bash
        env:
          PPO_PLUGIN_PATH: ${{ runner.temp }}/plugin/PPOnline.rel
        run: |
          npm run stage:plugin
          npm run build
          npx electron-builder build --win --publish never
          ls -l release/build
      - name: Check the package
        working-directory: launcher/release/build
        shell: bash
        run: |
          ../../../.github/scripts/check-package.sh win-unpacked
          mkdir -p "$RUNNER_TEMP/out-win"
          mv latest.yml *.exe "$RUNNER_TEMP/out-win/"
          # No blockmap while nsis.differentialPackage is false (the updater downloads in full).
          mv *.exe.blockmap "$RUNNER_TEMP/out-win/" 2>/dev/null || true
          ls -l "$RUNNER_TEMP/out-win"
      - uses: actions/upload-artifact@v7
        with:
          name: launcher-windows
          path: ${{ runner.temp }}/out-win/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  macos:
    # Cross-compiled on the Unraid runner: osxcross with Apple's SDK and LLVM 20 are in its image,
    # Qt for macOS, rcodesign and libdmg-hfsplus in $CI_CACHE (setup-macos-toolchain.sh). Apple
    # silicon (arm64) only for now. Ad-hoc signed, not notarized (no Apple Developer ID yet).
    # Enabled by the repository variable ENABLE_MACOS="true". The Unraid box corrupts compiles
    # under load until its memory is fixed (docs/ci.md), so don't enable it for releases before.
    if: ${{ vars.ENABLE_MACOS == 'true' }}
    needs: plugin
    runs-on: [self-hosted, linux, x64, unraid, brawlonline]
    timeout-minutes: 240
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      USE_HARD_LINKS: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          path: client
          persist-credentials: false
      - name: Toolchain
        run: client/.github/scripts/setup-macos-toolchain.sh >> "$GITHUB_PATH"
      - name: Stamp version ${{ env.VERSION }}
        run: client/.github/scripts/stamp-version.sh "$VERSION"
      - name: Dolphin
        run: client/.github/scripts/build-dolphin-macos.sh "$VERSION" "$GITHUB_WORKSPACE/client/launcher/release/dolphin" arm64
      - uses: actions/download-artifact@v7
        with:
          name: plugin
          path: ${{ runner.temp }}/plugin
      - name: Launcher dependencies
        working-directory: client/launcher
        run: |
          nice -n 19 npm ci --no-audit --no-fund
          node node_modules/electron/install.js
      - name: Launcher build
        working-directory: client/launcher
        env:
          PPO_PLUGIN_PATH: ${{ runner.temp }}/plugin/PPOnline.rel
        run: |
          npm run stage:plugin
          nice -n 19 npm run build
      - name: Package (app, zip, DMG)
        run: client/.github/scripts/package-launcher-macos.sh "$VERSION" "$RUNNER_TEMP/out-mac" arm64
      - uses: actions/upload-artifact@v7
        with:
          name: launcher-mac
          path: ${{ runner.temp }}/out-mac/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Clean up
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/out-mac" "$RUNNER_TEMP/plugin" client/launcher/release/build client/launcher/release/dolphin
          du -sh "${CI_CACHE:-$HOME/ci-cache}"/* 2>/dev/null || true

  publish:
    needs: [linux, windows, macos]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.windows.result == 'success' }}
    runs-on: [self-hosted, linux, x64, sarahvps2, brawlonline]
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write # delete this run's artifacts after publishing
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: launcher-*
          path: ${{ runner.temp }}/client
          merge-multiple: true
      - name: Publish
        run: |
          ls -l "$RUNNER_TEMP/client"
          sudo -n /usr/local/sbin/pp-release client "$RUNNER_TEMP/client"
      - name: Check
        run: |
          base=https://brawlonline.net
          for f in latest.yml latest-linux.yml; do
            got=$(curl -fsS --max-time 20 "$base/updates/launcher/$f?nocache=$GITHUB_RUN_ID" | sed -n 's/^version: //p')
            echo "$f: $got"
            [ "$got" = "$VERSION" ] || { echo "$f does not name $VERSION" >&2; exit 1; }
          done
          for f in BrawlOnline-Setup.exe BrawlOnline.AppImage; do
            curl -fsS --max-time 20 -o /dev/null -r 0-0 -w "$f: %{http_code}\n" "$base/downloads/$f?v=$VERSION"
          done
      - name: Delete this run's artifacts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions"
          ids=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$api/runs/$GITHUB_RUN_ID/artifacts?per_page=100" |
            python3 -c 'import json,sys; print(" ".join(str(a["id"]) for a in json.load(sys.stdin)["artifacts"]))')
          for id in $ids; do
            curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$api/artifacts/$id" && echo "deleted artifact $id"
          done
          rm -rf "$RUNNER_TEMP/client"
