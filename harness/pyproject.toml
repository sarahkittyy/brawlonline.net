[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppharness"
version = "0.1.0"
description = "End-to-end test harness for the Project+ rollback Dolphin fork"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ppharness = "ppharness.cli:main"

[tool.setuptools]
packages = ["ppharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "dolphin: needs the real Dolphin build with harness support (skipped otherwise)",
    "slow: takes more than a few seconds",
    "gpu: needs a real video backend (D3D11/Vulkan); skipped with --no-gpu or when none works",
]
